---
# Runs before fact gathering: on RHEL 8.10 the default interpreter is Python
# 3.6, which modern ansible-core cannot use. See tasks/bootstrap_python.yml.
- name: Ensure the target has a Python ansible-core can use
  hosts: s1_mgmt
  gather_facts: false
  become: true
  tags: [always]
  tasks:
    - import_tasks: tasks/bootstrap_python.yml

- name: Install the SentinelOne self-hosted Management Console
  hosts: s1_mgmt
  gather_facts: true
  become: true
  any_errors_fatal: true
  roles:
    - s1_mgmt
