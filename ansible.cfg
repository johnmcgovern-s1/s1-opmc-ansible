[defaults]
inventory            = inventory.ini
roles_path           = roles
retry_files_enabled  = False
# community.general.yaml was removed in v12; this is its replacement.
stdout_callback      = default
result_format        = yaml
interpreter_python   = auto_silent
timeout              = 60

[ssh_connection]
# The vendor deploy runs 20-40 minutes inside a single SSH command.
# ControlPersist + keepalives stop the session dying mid-deploy.
pipelining  = True
ssh_args    = -o ControlMaster=auto -o ControlPersist=60m -o ServerAliveInterval=30 -o ServerAliveCountMax=120
