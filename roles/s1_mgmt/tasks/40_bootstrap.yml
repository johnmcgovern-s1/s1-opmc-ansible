---
# Installs docker-ce, pip, the docker Python package and the vendor's pinned
# Ansible, then resolves the runtime that 60_deploy.yml will shell out to.
#
# The install itself is per-OS because the vendor ships two entirely separate
# mechanisms: RHEL has an offline_installation.sh dispatcher, Ubuntu has two
# standalone scripts and no dispatcher at all. Everything after that — locating
# ansible-playbook and deriving its interpreter — is shared, because the
# mechanism (resolve the binary, read its shebang) holds on both.

- name: Bootstrap the vendor tooling (RHEL)
  ansible.builtin.import_tasks: 41_bootstrap_rhel.yml
  when: ansible_os_family == 'RedHat'

- name: Bootstrap the vendor tooling (Ubuntu)
  ansible.builtin.import_tasks: 42_bootstrap_ubuntu.yml
  when: ansible_os_family == 'Debian'

# --- Resolve the vendor Ansible runtime -------------------------------------
# Read off the host rather than from a table. The real binary moves between
# releases — and between releases sharing a prefix on the same OS — but each
# platform has a stable path to start from:
#
#   RHEL   /root/.local/bin/ansible-playbook   created deliberately by every
#                                              release "for backward
#                                              compatibility"
#   Ubuntu /usr/local/bin/ansible-playbook     where pip lands the entry point;
#                                              Ubuntu does NOT create the
#                                              documented RHEL path (PKG-005)

- name: Select the expected ansible-playbook path for this platform
  ansible.builtin.set_fact:
    s1_expected_bin: >-
      {{ s1_ubuntu_playbook_bin if ansible_os_family == 'Debian'
         else s1_documented_playbook_bin }}

- name: Locate the vendor ansible-playbook
  ansible.builtin.stat:
    path: "{{ s1_expected_bin }}"
  register: s1_bin_stat
  when: s1_bin | length == 0

# Purely diagnostic: its output feeds the failure message below, so it must
# never fail itself. `find /` exits non-zero on transient unreadable paths even
# as root, which with `set -o pipefail` used to kill this task and suppress the
# helpful message. Symlinks count too — every O release links the real binary
# into /root/.local/bin rather than installing it there.
- name: Search for ansible-playbook when the expected path is absent
  ansible.builtin.shell: >-
    find / \( -type f -o -type l \) -name ansible-playbook -executable
    2>/dev/null | head -20
  args:
    executable: /bin/bash
  register: s1_bin_search
  changed_when: false
  failed_when: false
  when:
    - s1_bin | length == 0
    - not s1_bin_stat.stat.exists

- name: Fail with the candidates found on the host
  ansible.builtin.fail:
    msg: |
      The vendor tooling ran, but {{ s1_expected_bin }} does not exist.

      Candidates on this host:
      {{ s1_bin_search.stdout | default('(none found)') }}

      Set s1_playbook_bin (and probably s1_python_interpreter) and re-run.
  when:
    - s1_bin | length == 0
    - not s1_bin_stat.stat.exists

- name: Adopt the expected ansible-playbook path
  ansible.builtin.set_fact:
    s1_bin: "{{ s1_expected_bin }}"
  when: s1_bin | length == 0

# The shebang names the Python the vendor installed its Ansible into, which is
# also the one carrying the `docker` package it needs:
#   O-25.4.4  RHEL 9    -> /usr/bin/python3.11        (pip --prefix=/usr/local)
#   O-25.4.6+ RHEL 9    -> the venv's python3.11
#   O-26.1.1  Ubuntu 24 -> /usr/bin/python3           (pip --break-system-packages)
# Resolve symlinks first: the expected path may point at the real binary.
- name: Derive the interpreter from the ansible-playbook shebang
  ansible.builtin.shell: |
    set -e
    target=$(readlink -f {{ s1_bin | quote }})
    head -1 "$target" | sed -n 's|^#!\s*\([^ ]*\).*|\1|p'
  args:
    executable: /bin/bash
  register: s1_py_shebang
  changed_when: false
  failed_when: false
  when: s1_py | length == 0

- name: Adopt the derived interpreter
  ansible.builtin.set_fact:
    s1_py: "{{ s1_py_shebang.stdout | trim }}"
  when:
    - s1_py | length == 0
    - (s1_py_shebang.stdout | default('') | trim) | length > 0

- name: Fail when no interpreter could be derived
  ansible.builtin.fail:
    msg: |
      Could not read an interpreter from the shebang of {{ s1_bin }}.
      Set s1_python_interpreter explicitly and re-run.
  when: s1_py | length == 0

# Ubuntu only, and only once the interpreter is known: install the docker
# wheels the vendor scripts leave behind and apply the compatibility patch that
# silently no-ops. Both target the interpreter resolved above.
- name: Apply the fixes the Ubuntu vendor scripts omit
  ansible.builtin.import_tasks: 43_bootstrap_ubuntu_fixups.yml
  when:
    - ansible_os_family == 'Debian'
    - s1_ubuntu_apply_vendor_fixups | bool

# The vendor deploy drives Docker through Ansible's docker modules. If the
# interpreter cannot import docker, that surfaces 20+ minutes into the deploy
# as a module failure; catching it here costs a second.
- name: Verify the derived interpreter can import docker
  ansible.builtin.command: "{{ s1_py | quote }} -c 'import docker'"
  changed_when: false
  register: s1_docker_import
  failed_when: false

- name: Fail when the interpreter cannot import docker
  ansible.builtin.fail:
    msg: |
      {{ s1_py }} cannot import the docker Python package, which the vendor
      deploy requires:
      {{ s1_docker_import.stderr | default('') | trim }}

      On RHEL this usually means offline_installation.sh installed docker into a
      different interpreter. On Ubuntu the vendor scripts never install it at
      all (PKG-007) — check whether s1_ubuntu_apply_vendor_fixups was disabled.
      Set s1_python_interpreter to the interpreter that has it.
  when: s1_docker_import.rc != 0

- name: Report the Python version behind the vendor Ansible
  ansible.builtin.shell: "{{ s1_bin | quote }} --version | grep -i 'python version'"
  register: s1_ansible_py
  changed_when: false
  failed_when: false

# The docs want Python 3.8 for S-prefix on RHEL 8, but the bundled repo only
# carries python36 and the docs accept 3.6 as a fallback. Surface it rather
# than fight it.
- name: Show the resolved Ansible runtime
  ansible.builtin.debug:
    msg:
      - "binary      : {{ s1_bin }}{{ ' (override)' if s1_playbook_bin | length > 0 else ' (expected path)' }}"
      - "interpreter : {{ s1_py }}{{ ' (override)' if s1_python_interpreter | length > 0 else ' (from shebang)' }}"
      - "docker pkg  : importable"
      - "{{ s1_ansible_py.stdout | default('python version not reported') }}"
