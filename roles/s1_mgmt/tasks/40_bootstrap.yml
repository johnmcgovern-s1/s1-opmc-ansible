---
# Installs docker-ce, pip, the docker python package and the vendor's pinned
# Ansible. Entirely offline: offline_installation.sh writes its own
# /etc/yum.repos.d/sentinelone.repo pointing at file://.../rhel{8,9} and runs
# every dnf call with --disablerepo=* --enablerepo=sentinelone. Neither RHSM
# nor the DVD is consulted.

- name: Remove podman packages that conflict with docker-ce
  ansible.builtin.dnf:
    name:
      - podman
      - podman-manpages
      - buildah
    state: absent
    disablerepo: "*"
  failed_when: false

# Optional and off by default. The bundled repo ships python36 (S) or
# python3.11 (O) — never python38 — so this needs RHSM or a DVD repo.
- name: Install Python 3.8 from an external repo (S-prefix, RHEL 8, opt-in)
  ansible.builtin.dnf:
    name: python38
    state: present
  when:
    - s1_install_python38 | bool
    - s1_prefix == 'S'
    - ansible_distribution_major_version == '8'

- name: Install docker-ce, pip and the docker python package
  ansible.builtin.command: ./offline_installation.sh install_docker_and_pip
  args:
    chdir: "{{ s1_docker_ansible }}/rhel"
  register: s1_bootstrap_docker
  changed_when: true

- name: Detect the RHEL 10 kernel-reboot condition
  ansible.builtin.fail:
    msg: >-
      offline_installation.sh reported KERNEL UPDATE INSTALLED - REBOOT REQUIRED.
      Reboot the server and re-run this playbook.
  when: "'REBOOT REQUIRED' in (s1_bootstrap_docker.stdout | default(''))"

# For O-prefix this is already done inside install_docker_and_pip; re-running is
# harmless (pip --upgrade). For S-prefix it is a required second step.
- name: Install the vendor-pinned Ansible
  ansible.builtin.command: ./offline_installation.sh install_ansible
  args:
    chdir: "{{ s1_docker_ansible }}/rhel"
  changed_when: true

- name: Ensure the Docker daemon is enabled and running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
    daemon_reload: true

# --- Resolve the vendor Ansible runtime -------------------------------------
# Read off the host rather than from a table. The real binary moves between
# releases — and between releases sharing a prefix on the same OS — but every
# release examined creates /root/.local/bin/ansible-playbook for backward
# compatibility, because the vendor docs tell customers to invoke that path.

- name: Locate the vendor ansible-playbook
  ansible.builtin.stat:
    path: "{{ s1_documented_playbook_bin }}"
  register: s1_bin_stat
  when: s1_bin | length == 0

# Purely diagnostic: its output feeds the failure message below, so it must
# never fail itself. `find /` exits non-zero on transient unreadable paths even
# as root, which with `set -o pipefail` used to kill this task and suppress the
# helpful message. Symlinks count too — every O release links the real binary
# into /root/.local/bin rather than installing it there.
- name: Search for ansible-playbook when the documented path is absent
  ansible.builtin.shell: >-
    find / \( -type f -o -type l \) -name ansible-playbook -executable
    2>/dev/null | head -20
  args:
    executable: /bin/bash
  register: s1_bin_search
  changed_when: false
  failed_when: false
  when:
    - s1_bin | length == 0
    - not s1_bin_stat.stat.exists

- name: Fail with the candidates found on the host
  ansible.builtin.fail:
    msg: |
      offline_installation.sh ran, but {{ s1_documented_playbook_bin }} does
      not exist. Every release examined creates it, so this package may lay
      things out differently.

      Candidates on this host:
      {{ s1_bin_search.stdout | default('(none found)') }}

      Set s1_playbook_bin (and probably s1_python_interpreter) and re-run.
  when:
    - s1_bin | length == 0
    - not s1_bin_stat.stat.exists

- name: Adopt the documented ansible-playbook path
  ansible.builtin.set_fact:
    s1_bin: "{{ s1_documented_playbook_bin }}"
  when: s1_bin | length == 0

# The shebang names the Python the vendor installed its Ansible into, which is
# also the one carrying the `docker` package it needs:
#   O-25.4.4  RHEL 9  -> /usr/bin/python3.11        (pip --prefix=/usr/local)
#   O-25.4.6+ RHEL 9  -> the venv's python3.11
# Resolve symlinks first: the documented path points at the real binary.
- name: Derive the interpreter from the ansible-playbook shebang
  ansible.builtin.shell: |
    set -e
    target=$(readlink -f {{ s1_bin | quote }})
    head -1 "$target" | sed -n 's|^#!\s*\([^ ]*\).*|\1|p'
  args:
    executable: /bin/bash
  register: s1_py_shebang
  changed_when: false
  failed_when: false
  when: s1_py | length == 0

- name: Adopt the derived interpreter
  ansible.builtin.set_fact:
    s1_py: "{{ s1_py_shebang.stdout | trim }}"
  when:
    - s1_py | length == 0
    - (s1_py_shebang.stdout | default('') | trim) | length > 0

- name: Fail when no interpreter could be derived
  ansible.builtin.fail:
    msg: |
      Could not read an interpreter from the shebang of {{ s1_bin }}.
      Set s1_python_interpreter explicitly and re-run.
  when: s1_py | length == 0

# The vendor deploy drives Docker through Ansible's docker modules. If the
# interpreter cannot import docker, that surfaces 20+ minutes into the deploy
# as a module failure; catching it here costs a second.
- name: Verify the derived interpreter can import docker
  ansible.builtin.command: "{{ s1_py | quote }} -c 'import docker'"
  changed_when: false
  register: s1_docker_import
  failed_when: false

- name: Fail when the interpreter cannot import docker
  ansible.builtin.fail:
    msg: |
      {{ s1_py }} cannot import the docker Python package, which the vendor
      deploy requires:
      {{ s1_docker_import.stderr | default('') | trim }}

      This usually means offline_installation.sh installed docker into a
      different interpreter. Set s1_python_interpreter to the one that has it.
  when: s1_docker_import.rc != 0

- name: Report the Python version behind the vendor Ansible
  ansible.builtin.shell: "{{ s1_bin | quote }} --version | grep -i 'python version'"
  register: s1_ansible_py
  changed_when: false
  failed_when: false

# The docs want Python 3.8 for S-prefix on RHEL 8, but the bundled repo only
# carries python36 and the docs accept 3.6 as a fallback. Surface it rather
# than fight it.
- name: Show the resolved Ansible runtime
  ansible.builtin.debug:
    msg:
      - "binary      : {{ s1_bin }}{{ ' (override)' if s1_playbook_bin | length > 0 else ' (documented path)' }}"
      - "interpreter : {{ s1_py }}{{ ' (override)' if s1_python_interpreter | length > 0 else ' (from shebang)' }}"
      - "docker pkg  : importable"
      - "{{ s1_ansible_py.stdout | default('python version not reported') }}"
