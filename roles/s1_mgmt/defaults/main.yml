---
# ============================================================================
# Package location and layout
# ============================================================================

# Absolute path to the pre-staged .tar.gz ON THE TARGET SERVER.
s1_package_path: /var/tmp/SentinelOne_MGMT_S_25_3_2_096.tar.gz

# Sidecar of known-good SHA256 sums, checked before the package is unpacked.
# The vendor's download service is unreliable and truncated/corrupt tarballs
# otherwise fail deep inside the deploy.
s1_checksums_file: "{{ playbook_dir }}/checksums.yml"

# When true (default), a package with no entry in the sidecar is refused
# outright. The package's RPMs are installed with gpgcheck disabled and its
# playbooks run as root, so an unverified package is a supply-chain risk.
# Set false to let an unlisted package through with a warning instead.
s1_require_checksum: true

# Version directory name, e.g. "S-25.3.2". Left empty it is derived from the
# package filename, matching both vendor naming styles:
#   SentinelOne_MGMT_S_25_3_2_096.tar.gz -> S-25.3.2
#   sentinel_mgmt_o_25_4_6_034.tar.gz    -> O-25.4.6
s1_version: ""

# Parent directory for the extracted tree. Empty = home dir of ansible_user,
# giving ~/S-25.3.2/. Old versions are left in place for easy upgrades; it is
# the operator's job to prune them.
s1_install_base: ""

# ============================================================================
# Console configuration -> written into the vendor's group_vars/all/config.yml
# Any value left empty is NOT written; the vendor's blank default is kept.
# ============================================================================

s1_mount_dir: /data
s1_accessible_url: ""

# Certificates: paths on the CONTROL NODE, copied to the target.
s1_key_src: certificates/certificate.key
s1_pem_src: certificates/certificate.pem

# Where the pair is staged on the TARGET (root-only, 0700). The vendor deploy
# rsyncs them from here as root, so any root-readable path works — do not use
# a world-writable directory like /tmp for private key material.
s1_cert_dir: /etc/sentinelone/certs

# 30_certs.yml creates s1_cert_dir only when it is absent, and never alters the
# permissions of a directory it did not create. If the directory already exists
# and is world-writable it refuses, because staging an unencrypted private key
# there exposes it to every local user. Set true to proceed anyway — the
# directory's own permissions are still left alone either way.
s1_allow_world_writable_cert_dir: false

s1_admin_fullname: ""
s1_admin_email: ""
# Set in group_vars/all/vault.yml (ansible-vault encrypted).
s1_admin_password: ""

# Air-gapped deployments leave all of these empty.
s1_custom_aes_key: ""
s1_cloud_address: ""
s1_cloud_token: ""
s1_mgmt_id: ""
s1_account_name: ""
s1_salesforce_id: ""

# ============================================================================
# Behaviour
# ============================================================================

# Storage checks are advisory by default: a separate /data partition is a
# sizing guardrail, not an installer requirement.
s1_verify_storage: true
s1_storage_fail_hard: false
s1_min_free_gb_install: 20     # for the extracted package (~15GB)
s1_min_free_gb_data: 100       # for mount_dir

# Deploy is gated on /s1/conf/settings.ini. Set true to re-run over an install.
s1_force_redeploy: false
s1_deploy_timeout: 7200

# Required from S-24.2.5.173 onward. Both current packages are past that.
s1_set_force_legacy_token: true

# Only needed if the bundled python36 (S-prefix) proves insufficient. Requires
# an external repo (RHSM or DVD) — the bundled repo has no python38.
s1_install_python38: false

# Escape hatch for validating on an untested minor release.
s1_allow_unsupported_os: false

# O-prefix packages ship MongoDB 5.0+, which requires AVX. Set false only if
# you are certain the package ships MongoDB 4.4 or earlier.
s1_require_avx: true

# Resource floors. The console runs 20+ containers; an under-provisioned host
# fails ~20 minutes into the vendor deploy with "Cannot allocate memory" and can
# leave the box unreachable. Check the vendor's prerequisites article for the
# authoritative numbers and adjust.
s1_check_resources: true
s1_min_ram_gb: 16      # hard floor — below this the deploy will not complete
s1_rec_ram_gb: 32      # recommended
s1_rec_vcpus: 8

# Containers the vendor documents as unhealthy by design. Excluded from the
# health check so a clean install does not report false failures.
#
# incoming-command-processor is deliberately NOT here: it is a restart loop
# rather than an unhealthy check, it is release-specific, and excusing it on
# every release would hide a real failure. It is excluded only on the releases
# in s1_icp_disable_versions below.
s1_known_unhealthy_containers:
  - tags-synchronizer
  - mgmt-entities-uploader
  - mgmt-entities-cdc
  - ranger-fingerprint-consumer

# --- incoming-command-processor --------------------------------------------
# Releases on which ICP restart-loops after deployment and the feature should
# be switched off. Product confirmed the underlying issue was fixed after
# O-25.4.4, so later releases are deliberately NOT listed: a restart-looping
# ICP there is a real failure and should stay visible.
#
# Note what the vendor articles do and do not say. They give two command forms
# and scope them by PREFIX (S vs O), not by release, and they phrase the remedy
# as "after you upgrade" — they never state which releases are affected. The
# release list below is product knowledge, not something the articles assert.
s1_icp_disable: true
s1_icp_disable_versions:
  - S-25.3.2
  - O-25.4.4

# How long 80_verify waits for container health checks to settle before judging
# them. Containers come up in "health: starting" and some take minutes to pass
# their first check, so a snapshot taken straight after the deploy reports a
# healthy install as broken. Defaults give up to 5 minutes.
s1_verify_retries: 30
s1_verify_delay: 10

# ============================================================================
# Ansible runtime — discovered from the host, not hardcoded
# ============================================================================
# The vendor moves the real ansible-playbook between releases, and it varies
# for the SAME prefix on the SAME OS:
#
#   S-25.3.2  RHEL 8/9   pip3 --user            -> /root/.local/bin
#   O-25.4.4  RHEL 8/9   pip --prefix=/usr/local -> /usr/local/bin
#   O-25.4.6+ RHEL 8     pip --prefix=/usr/local -> /usr/local/bin
#   O-25.4.6+ RHEL 9/10  venv                    -> /opt/sentinelone/installer/bin
#
# A table keyed on prefix+major cannot express that, and got it wrong for
# O-25.4.4 on RHEL 9 (observed live: the deploy aborted at bootstrap). So the
# runtime is read off the host after offline_installation.sh has run — see
# 40_bootstrap.yml.
#
# Every release examined creates this path for backward compatibility, and the
# vendor docs tell customers to invoke it directly:
s1_documented_playbook_bin: /root/.local/bin/ansible-playbook

# Ubuntu does not create the documented path (PKG-005), and where it does land
# depends on how that release's script installs Ansible:
#
#   ubuntu_24  pip install --break-system-packages  ->  /usr/local/bin
#   ubuntu_22  dpkg -i ansible/*  (distro package)  ->  /usr/bin
#
# Tried in order, first hit wins. A list rather than a per-release table for the
# same reason the interpreter is read from a shebang: the next Ubuntu the vendor
# adds needs no new entry unless it invents a third location.
s1_ubuntu_playbook_candidates:
  - /usr/local/bin/ansible-playbook
  - /usr/bin/ansible-playbook

# Set either of these to bypass discovery entirely.
s1_playbook_bin: ""
s1_python_interpreter: ""

# ============================================================================
# Ubuntu
# ============================================================================
# The vendor ships no offline_installation.sh outside docker_ansible/rhel/, so
# the two ubuntu_24 scripts are called directly. Passed to both explicitly
# because they read the argument inversely (PKG-008).
s1_offline_install: true

# Tooling directory inside the package. Empty means derive it from the OS major
# version — ubuntu_22 on 22.04, ubuntu_24 on 24.04. The vendor also ships
# ubuntu_14/18/20, which are not wired up: ubuntu_14's install_everything.sh
# reaches the internet unconditionally, and 18/20 are untested here. Set
# explicitly to force a specific tree.
s1_ubuntu_tooling: ""

# The vendor deploy calls bare `python` (roles/app/start_app_container.yml), and
# no Ubuntu since 20.04 ships /usr/bin/python. On 24.04 the ubuntu_24 pip bundle
# happens to include python-is-python3, so `dpkg -i pip/*` creates the symlink as
# a side effect and the call works. The ubuntu_22 bundle does not include it, so
# the deploy dies ~2 minutes in on "Create default UUID" (PKG-009).
#
# This creates the same symlink python-is-python3 would, and only when the path
# is absent — reproducing what the vendor already causes on the adjacent
# platform rather than inventing a workaround. Set false to leave the host
# alone and let the deploy fail as it would unaided.
s1_ubuntu_provide_python: true

# Two things the vendor scripts leave undone, without which the deploy cannot
# run: the bundled docker wheels are never installed (PKG-007), and the Python
# 3.12 readfp patch silently patches nothing (PKG-006). Set false to run the
# vendor tooling unaided — useful for checking whether a later package has
# fixed either one.
s1_ubuntu_apply_vendor_fixups: true

# RHEL majors each prefix supports, from the case statement in
# docker_ansible/rhel/offline_installation.sh. The OS gate for both roles.
s1_supported_rhel_majors:
  S: ["7", "8", "9"]
  O: ["7", "8", "9", "10"]

# Prefix alone is not enough for RHEL 10: it is NOT supported by every
# O-prefix release. The script was read out of all four tarballs (2026-08-04):
#
#   S-25.3.2   case 7*|8*|9*        no rhel10 dir
#   O-25.4.4   case 7*|8*|9*        no rhel10 dir
#   O-25.4.6   case 7*|8*|9*        no rhel10 dir
#   O-26.1.1   case 7*|8*|9*|10*    ships docker_ansible/rhel/rhel10
#
# The first three fall through to the default arm and exit with
# "Error: RHEL 10.2 is not supported" before installing anything. O-26.1.1
# sets PYTHON_VERSION=3.12 for RHEL 10 and builds the venv at
# /opt/sentinelone/installer.
#
# A consequence worth stating plainly: no upgrade chain can run on RHEL 10,
# because no release that could precede O-26.1.1 will install there.
s1_min_version_rhel10: "26.1.1"

# First release shipping docker_ansible/ubuntu_24. S-25.3.2 has no such
# directory, so as with RHEL 10 there is no chain to upgrade along on this
# platform — the first release that installs is also the earliest.
#
# This was 25.4.6 for a while, because O-25.4.4 bootstraps fine and then dies
# ~2 minutes into the deploy: deploy_mgmt.yml calls bare `python`, and Ubuntu
# has no /usr/bin/python. O-25.4.6 never fixed that line — it is byte-identical
# — its pip bundle merely happens to carry python-is-python3, which creates the
# symlink incidentally. Now that s1_ubuntu_provide_python supplies it on any
# release, that distinction no longer gates anything, and O-25.4.4 installs
# cleanly here (verified: 25 containers, none unexpectedly unhealthy).
s1_min_version_ubuntu24: "25.4.4"
